<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title">
  <title id="title">HomelabScribe: documentation for your homelab that writes itself, and keeps your notes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0A1322"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8FB3E0"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4C86E0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C86E0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)" opacity="0.09"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <svg x="48" y="56" width="208" height="208" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ltile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18304F"/>
      <stop offset="1" stop-color="#0B1626"/>
    </linearGradient>
    <linearGradient id="lnib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#F09A1A"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ltile)"/>

  <!-- Page -->
  <path d="M164 92 H316 L380 156 V396 a24 24 0 0 1 -24 24 H164 a24 24 0 0 1 -24 -24 V116 a24 24 0 0 1 24 -24 Z" fill="#F5F1E8"/>
  <path d="M316 92 V136 a20 20 0 0 0 20 20 H380 Z" fill="#D6CDBA"/>

  <!-- Rack units: the part HomelabScribe writes for you -->
  <g>
    <rect x="168" y="148" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="166" r="6.5" fill="#34D399"/>
    <rect x="208" y="162" width="56" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="158" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="158" width="5" height="16" rx="2.5" fill="#3E5A80"/>

    <rect x="168" y="194" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="212" r="6.5" fill="#34D399"/>
    <rect x="208" y="208" width="80" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="204" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="204" width="5" height="16" rx="2.5" fill="#3E5A80"/>

    <rect x="168" y="240" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="258" r="6.5" fill="#FFB938"/>
    <rect x="208" y="254" width="44" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="250" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="250" width="5" height="16" rx="2.5" fill="#3E5A80"/>
  </g>

  <!-- Your notes: the part HomelabScribe never touches -->
  <path d="M170 324 q11 -12 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#E8900F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 362 q11 -12 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#E8900F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nib -->
  <g transform="translate(262 366) rotate(45) scale(0.92)">
    <path d="M0 0 L-30 -66 Q-33 -74 -26 -80 V-112 a8 8 0 0 1 8 -8 H18 a8 8 0 0 1 8 8 V-80 Q33 -74 30 -66 Z"
          fill="url(#lnib)" stroke="#0B1626" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -2 V-50" stroke="#0B1626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-56" r="8" fill="#0B1626"/>
    <rect x="-26" y="-96" width="52" height="7" fill="#0B1626" opacity="0.35"/>
  </g>
</svg>
  <text x="292" y="150" text-anchor="start" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="72" letter-spacing="-1.2" fill="#F5F1E8">Homelab<tspan fill="#FFB938">Scribe</tspan></text>
  <text font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#B8C9E0">
    <tspan x="296" y="198">Documentation for your homelab that</tspan>
    <tspan x="296" y="232">writes itself, and keeps your notes.</tspan>
  </text>
  <rect x="296.0" y="254" width="103.9" height="30" rx="15.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="347.9" y="272" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9FC0E8">read-only</text>
  <rect x="409.9" y="254" width="87.0" height="30" rx="15.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="453.3" y="272" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9FC0E8">private</text>
  <rect x="506.8" y="254" width="179.7" height="30" rx="15.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="596.7" y="272" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9FC0E8">no secrets on disk</text>
  <rect x="696.6" y="254" width="95.4" height="30" rx="15.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="744.3" y="272" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9FC0E8">Markdown</text>
  <g transform="rotate(-2.5 1050 170)"><rect x="878" y="46" width="352" height="262" rx="16" fill="#000" opacity="0.28" transform="translate(6 8)"/><path d="M894 46 H1192 L1230 84 V292 a16 16 0 0 1 -16 16 H894 a16 16 0 0 1 -16 -16 V62 a16 16 0 0 1 16 -16 Z" fill="#F5F1E8"/><path d="M1192 46 V72 a12 12 0 0 0 12 12 H1230 Z" fill="#D6CDBA"/><circle cx="904" cy="70" r="5" fill="#34D399"/><text x="916" y="75" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7A8699">services/sonarr.md</text><line x1="898" y1="86" x2="1180" y2="86" stroke="#E2DACB" stroke-width="1.5"/><text x="900" y="104" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#18304F"># Sonarr</text><text x="900" y="130" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#5B6B80">TV shows, found and fetched.</text><text x="900" y="166" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#18304F">## Ports</text><text x="900" y="190" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#3E5A80">8989/tcp  →  web UI</text><text x="900" y="226" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#1F9E74">&lt;!-- homelabscribe:notes:start --&gt;</text><text x="900" y="256" font-family="Noteworthy, 'Bradley Hand', 'Segoe Print', cursive" font-size="20" font-weight="normal" fill="#D9820A">Upgraded to v4 on Oct 3.</text><text x="900" y="284" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#1F9E74">&lt;!-- homelabscribe:notes:end --&gt;</text></g>
</svg>
