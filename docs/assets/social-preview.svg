  <rect x="491.4" y="512" width="95.4" height="32" rx="16.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="539.1" y="532" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#9FC0E8">private</text>
  <rect x="596.8" y="512" width="201.4" height="32" rx="16.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="697.5" y="532" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#9FC0E8">no secrets on disk</text>
  <rect x="808.2" y="512" width="105.1" height="32" rx="16.0" fill="#13243F" stroke="#35537D" stroke-width="1.5"/>
  <text x="860.7" y="532" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#9FC0E8">Markdown</text>
</svg>
