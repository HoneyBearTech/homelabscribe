<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title">
  <title id="title">HomelabScribe social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0A1322"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8FB3E0"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4C86E0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C86E0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="0" fill="url(#dots)" opacity="0.09"/>
  <rect width="1280" height="640" rx="0" fill="url(#glow)"/>
  <svg x="530" y="70" width="220" height="220" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18304F"/>
      <stop offset="1" stop-color="#0B1626"/>
    </linearGradient>
    <linearGradient id="snib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#F09A1A"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#stile)"/>

  <!-- Page -->
  <path d="M164 92 H316 L380 156 V396 a24 24 0 0 1 -24 24 H164 a24 24 0 0 1 -24 -24 V116 a24 24 0 0 1 24 -24 Z" fill="#F5F1E8"/>
  <path d="M316 92 V136 a20 20 0 0 0 20 20 H380 Z" fill="#D6CDBA"/>

  <!-- Rack units: the part HomelabScribe writes for you -->
  <g>
    <rect x="168" y="148" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="166" r="6.5" fill="#34D399"/>
    <rect x="208" y="162" width="56" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="158" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="158" width="5" height="16" rx="2.5" fill="#3E5A80"/>

    <rect x="168" y="194" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="212" r="6.5" fill="#34D399"/>
    <rect x="208" y="208" width="80" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="204" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="204" width="5" height="16" rx="2.5" fill="#3E5A80"/>

    <rect x="168" y="240" width="184" height="36" rx="9" fill="#18304F"/>
    <circle cx="189" cy="258" r="6.5" fill="#FFB938"/>
    <rect x="208" y="254" width="44" height="8" rx="4" fill="#3E5A80"/>
    <rect x="316" y="250" width="5" height="16" rx="2.5" fill="#3E5A80"/>
    <rect x="328" y="250" width="5" height="16" rx="2.5" fill="#3E5A80"/>
  </g>

  <!-- Your notes: the part HomelabScribe never touches -->
  <path d="M170 324 q11 -12 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#E8900F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 362 q11 -12 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#E8900F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nib -->
  <g transform="translate(262 366) rotate(45) scale(0.92)">
    <path d="M0 0 L-30 -66 Q-33 -74 -26 -80 V-112 a8 8 0 0 1 8 -8 H18 a8 8 0 0 1 8 8 V-80 Q33 -74 30 -66 Z"
          fill="url(#snib)" stroke="#0B1626" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -2 V-50" stroke="#0B1626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-56" r="8" fill="#0B1626"/>
    <rect x="-26" y="-96" width="52" height="7" fill="#0B1626" opacity="0.35"/>
  </g>
</svg>
  <text x="640" y="410" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="104" letter-spacing="-1.5" fill="#F5F1E8">Homelab<tspan fill="#FFB938">Scribe</tspan><tspan font-size="34" font-weight="500" letter-spacing="0" dy="-44" fill="#B8C9E0"> ™</tspan></text>
  <text x="640" y="470" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" fill="#B8C9E0">Documentation for your homelab that writes itself, and keeps your notes.</text>
