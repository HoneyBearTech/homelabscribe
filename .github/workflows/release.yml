name: Release

# Push a tag like v0.1.0 to publish. The workflow builds the wheel and sdist, publishes them to
# PyPI (trusted publishing) and the multi-arch image to GHCR, signs everything with Sigstore
# (keyless), and attaches checksums, an SBOM and build provenance to the GitHub release.
# Verify with docs/verifying-releases.md.
#
# Dry run: start this workflow by hand from the Actions tab (or `gh workflow run release.yml`). It builds
# and checks the packages, checksums and SBOM, and builds the multi-arch image without pushing it, but
# publishes, signs and releases nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build distributions, checksums and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/homelabscribe/__init__.py').read()).group(1))")
          if [ "v$version" != "$TAG" ] || [ "$version" != "$module" ]; then
            echo "Tag is $TAG, pyproject.toml says $version, __init__.py says $module. They must match."
            exit 1
          fi
      - run: pip install --require-hashes -r requirements/release.txt && python -m build
      - name: Check the packages and smoke-test the wheel in a clean environment
        run: |
          twine check dist/*
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/homelabscribe" version
          "$RUNNER_TEMP/smoke/bin/homelabscribe" demo -o "$RUNNER_TEMP/demo"
          test -f "$RUNNER_TEMP/demo/index.md"
      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS
      - name: SBOM (SPDX) of the wheel and every package it installs
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The smoke-test environment above holds the wheel plus the exact dependency versions pip chose.
          path: ${{ runner.temp }}/smoke
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Build the container image (pushed and signed only on a real release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (registries reject capitals in the owner name)
        id: ref
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/homelabscribe" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=dry-run,enable=${{ github.event_name != 'push' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: Sign the image by digest
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: dist
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing, no API token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS dist/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Sign artifacts and create the GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [dist, image, pypi]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign each artifact (keyless, bundle per file)
        working-directory: dist
        run: |
          for f in *.whl *.tar.gz SHA256SUMS sbom.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --title "$GITHUB_REF_NAME" --generate-notes
