version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  # The hash-pinned lockfiles used by CI, the release workflow and the Docker image.
  - package-ecosystem: "pip"
    directory: "/requirements"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"
    groups:
      lockfile-updates:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild, analyze and upload-sarif must share one version: analyze refuses
      # a configuration written by a different init.
      codeql-action:
        patterns: ["github/codeql-action*"]
