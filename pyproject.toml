[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "homelabscribe"
version = "0.2.1"
description = "Documentation for your homelab that writes itself — and keeps your notes."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "src/homelabscribe/pro/LICENSE-COMMERCIAL.md"]
authors = [{ name = "HoneyBearTech" }]
keywords = ["homelab", "selfhosted", "documentation", "docker", "proxmox", "obsidian"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Documentation",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "docker>=7.0",
  "proxmoxer>=2.0",
  "requests>=2.31",
  "pydantic>=2.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
homelabscribe = "homelabscribe.cli:app"

[project.urls]
Homepage = "https://homelabscribe.com"
Source = "https://github.com/HoneyBearTech/homelabscribe"
Issues = "https://github.com/HoneyBearTech/homelabscribe/issues"
Changelog = "https://github.com/HoneyBearTech/homelabscribe/blob/main/CHANGELOG.md"

# PyPI shows the README without the repository around it, so relative links would be dead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/HoneyBearTech/homelabscribe/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/tools",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/TRADEMARKS.md",
  "/Dockerfile",
  "/docker-compose.example.yml",
  "/homelabscribe.example.yaml",
]
exclude = ["/docs/assets"]

[tool.hatch.build.targets.wheel]
packages = ["src/homelabscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults are idiomatic
