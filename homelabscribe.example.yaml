# HomelabScribe configuration. Values like ${NAME} are read from environment variables.

output_dir: /docs          # where Markdown is written (e.g. a folder in your Obsidian vault)
state_dir: /data/.homelabscribe   # snapshots and changelog history

docker_hosts:
  - name: nova                       # how this host is named in the docs
    url: tcp://socket-proxy:2375      # or unix:///var/run/docker.sock
    # link_host: nova.lan            # hostname or IP used in service links (default: the name above)
  # - name: nas                       # more hosts need Pro
  #   url: tcp://192.168.1.20:2375

# Proxmox (Pro). Use a token with the PVEAuditor role; see README.
# proxmox:
#   - name: homelab
#     host: 192.168.1.10
#     user: homelabscribe@pve
#     token_name: docs
#     token_value: ${PVE_TOKEN}
#     verify_ssl: false              # self-signed certificate

# Nginx Proxy Manager: reads its proxy hosts so service pages get their real web address and a
# "Reverse proxy routes" page lists every domain. Create a dedicated NPM user that can only VIEW
# proxy hosts; logging in only creates a session token and nothing is changed.
# npm:
#   - name: npm
#     url: http://192.168.1.52:81
#     identity: homelabscribe@example.com
#     secret: ${NPM_PASSWORD}

# Things the scanners can't see: Pi-hole on a Raspberry Pi, a NAS, a router. They get normal pages,
# appear in the index, and can be listed under breakglass.critical. Only `name` and `host` are required.
# manual_services:
#   - name: pihole                    # known names (pihole, adguardhome) also mark the house DNS server
#     host: pi                        # a scanned host, or any new name to add a hand-described machine
#     url: http://192.168.1.2/admin
#     restart: "Unplug the Pi, wait 10 seconds, plug it back in."
#     # title / description / category: override the built-in catalog text

# Notifications (Pro): a short message after a scan that found changes or could not read a source.
# Opt-in, and sent only to the address below. A Discord webhook URL is a secret: keep it in an env var.
# notify:
#   - type: ntfy                      # ntfy topic URL; add `token:` if the topic needs a login
#     url: https://ntfy.example.com/homelab
#   - type: discord
#     url: ${DISCORD_WEBHOOK_URL}
#     on: [errors]                    # changes, errors (default: both)

# Extra or overriding app descriptions (same format as the built-in catalog).
# catalog_file: /config/catalog.yaml

# license_key: LS1....

# Break-glass guide for family (Pro).
breakglass:
  owner: Alex
  contacts:
    - "Name — phone — what they can help with"
  critical: [pihole, plex, homeassistant, vaultwarden]
